<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Магазин — Вход / Регистрация</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <header id="header"></header>

    <main>
      <div id="auth-container">
        <button id="show-login">Вход</button>
        <button id="show-register">Регистрация</button>

        <div id="login-form" class="auth-form">
          <h2>Вход</h2>

          <input type="email" id="login-email" placeholder="Email" />

          <input type="password" id="login-password" placeholder="Пароль" />

          <button id="login-btn">Войти</button>
        </div>

        <div id="register-form" class="auth-form" style="display: none">
          <h2>Регистрация</h2>

          <input type="text" id="register-name" placeholder="Имя" />

          <input type="email" id="register-email" placeholder="Email" />

          <input type="password" id="register-password" placeholder="Пароль" />

          <button id="register-btn">Зарегистрироваться</button>
        </div>
      </div>
    </main>

    <script src="js/models.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
